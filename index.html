<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161814">
    <meta
      name="description"
      content="A touch-friendly isometric three.js scape starter powered by threejs-scene."
    >
    <title>three-iso / isometric scape starter</title>
    <!-- critical css: the bare minimum to paint the page background, base text
         colour and loading overlay before the bundled stylesheet arrives. these
         values are mirrored in src/style.css — keep them in sync whenever either
         copy changes. -->
    <style>
      :root {
        color: #e9e9dd;
        /* keep in sync with src/style.css :root */
        font-family: Sofia Pro, Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        background: #191814;
        /* keep in sync with src/style.css :root */
      }
      * { box-sizing: border-box; }
      html, body, main, .scape {
        width: 100%;
        min-width: 20rem;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }
      body { overflow: hidden; overscroll-behavior: none; }
      .scape {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background:
          radial-gradient(circle at 70% 18%, rgb(191 162 145 / 20%), transparent 32%),
          #161814;
      }
      /* loading overlay — covers the scape while the canvas comes up, then fades
         out once the first frame is drawn. kept here so it appears instantly on
         the very first paint rather than waiting for the bundle. dismissed by a
         MutationObserver on data-scape-state in src/main.ts. */
      .loader {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #161814;
        transition: opacity 600ms ease-out;
      }
      .loader[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid rgb(217 241 143 / 15%);
        border-top-color: #d9f18f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { rotate: 360deg; }
      }
      /* reduced motion: no spin, just a gentle pulse so the reader knows
         something is still happening. */
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner {
          border-color: rgb(217 241 143 / 30%);
          border-top-color: #d9f18f;
          animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <figure class="scape" aria-labelledby="scape-title">
        <canvas
          data-scape
          tabindex="0"
          aria-label="interactive isometric landscape"
          aria-describedby="scape-controls scape-status"
        >
          your browser needs webgl to display this isometric landscape.
        </canvas>

        <figcaption id="scape-card" class="scape-card">
          <p class="scape-kicker">three-iso / starter</p>
          <h1 id="scape-title">isometric scape</h1>
          <ul id="scape-controls" class="scape-controls">
            <li class="pointer-help">click a place to orbit it · drag to pan</li>
            <li class="pointer-help">shift or right-drag to rotate · wheel to zoom</li>
            <li class="touch-help">tap a place to orbit it · one finger pans</li>
            <li class="touch-help">two fingers pan and pinch</li>
            <li class="keyboard-help">arrow keys pan · shift + arrows rotate · +/− zoom</li>
            <li class="keyboard-help">h hides and shows this card</li>
          </ul>
          <output id="scape-status" class="scape-status" aria-live="polite">
            building scape…
          </output>
        </figcaption>

        <!-- The drawer's chrome is markup, not script. It is the same furniture
             on every load, it has to survive the canvas being replaced under it
             after a context loss, and a panel whose frame ships with the page
             has a shape before the module that fills it has even parsed. Only
             the controls themselves are built at runtime, because only those
             depend on which tier resolved. -->
        <aside id="gfx" class="gfx" data-collapsed="true">
          <button
            id="gfx-toggle"
            class="gfx-toggle"
            type="button"
            aria-controls="gfx-body"
            aria-expanded="false"
            aria-label="show graphics settings"
          >‹</button>

          <header class="gfx-head">
            <p class="gfx-title">graphics</p>
            <button id="gfx-reset" class="gfx-reset" type="button">reset</button>
          </header>

          <!-- `autocomplete="off"` opts out of form-state restoration: these
               controls are a *view* of the config, and a browser putting them
               back the way they were left — after the initial sync — would show
               numbers the scene does not have. -->
          <form id="gfx-body" class="gfx-body" autocomplete="off"></form>

          <p id="gfx-foot" class="gfx-foot">webgl</p>
        </aside>
      </figure>

      <noscript>javascript is required to build the isometric scape.</noscript>
    </main>

    <!-- the loading overlay is markup, not script, for the same reason the
         drawer's chrome is: it has to be there on the very first paint, before
         the bundle has even been fetched. dismissed by a MutationObserver on
         data-scape-state in src/main.ts once the first frame is genuinely up.
         re-shown on context loss so the reader is not left staring at a dead
         canvas with no explanation. -->
    <!-- Hidden from assistive tech in its entirety, and deliberately: this is a
         picture of waiting, and the words are already being said. `#scape-status`
         above is an `<output aria-live="polite">` carrying "building scape…", and
         `role="status"` here would be a *second* polite live region announcing the
         same state — two voices for one event. The visibility toggle is
         `data-hidden` rather than `aria-hidden` for the same reason: the moment
         `aria-hidden` is what shows and hides a thing, it can no longer say
         whether the thing should be read. -->
    <div id="loader" class="loader" aria-hidden="true">
      <div class="loader-spinner" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
