<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12150f">
    <meta name="robots" content="noindex">
    <meta
      name="description"
      content="Contact sheet and four-viewport preview for the three-iso prop roster."
    >
    <title>three-iso / prop preview</title>
  </head>
  <body data-mode="index">
    <header class="preview-bar">
      <h1>prop preview</h1>

      <a id="back-to-index" class="single-only bar-link" href="?">← all props</a>

      <label class="single-only">
        prop
        <select id="prop-picker"></select>
      </label>

      <label class="index-only">
        filter
        <input id="prop-filter" type="search" placeholder="barn, spruce…" autocomplete="off">
      </label>

      <label>
        seed
        <input id="prop-seed" type="number" min="1" step="1" value="11">
      </label>

      <div class="toggle-set single-only">
        <label><input id="toggle-grid" type="checkbox" checked> grid</label>
        <label><input id="toggle-axes" type="checkbox" checked> axes</label>
        <label><input id="toggle-wireframe" type="checkbox"> wire</label>
        <label><input id="toggle-bounds" type="checkbox"> bounds</label>
      </div>

      <output id="prop-readout" aria-live="polite">building…</output>
    </header>

    <main class="preview-stage">
      <canvas
        id="preview-canvas"
        class="preview-canvas single-only"
        tabindex="0"
        aria-label="four-viewport orthographic preview of the selected prop"
      >
        your browser needs webgl to display the prop preview.
      </canvas>

      <div id="pane-labels" class="pane-labels single-only" aria-hidden="true"></div>

      <p class="preview-help single-only">
        drag to pan · drag the iso pane to orbit · shift-drag it to pan · wheel to zoom<br>
        1–4 solo a pane · 0 all four · f frame · g grid · x axes · w wire · b bounds · esc back
      </p>

      <section id="prop-index" class="index-only" aria-label="every prop in the roster"></section>

      <noscript>javascript is required to build the prop preview.</noscript>
    </main>
  <script type="module" src="/src/prop-preview/main.ts"></script>
  </body>
</html>
